<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapLink — URL Shortener</title>
    <meta name="description" content="Shorten your URLs instantly with SnapLink. Free, fast, and with click tracking.">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">🔗 SnapLink</div>
            <p class="tagline">Shorten. Share. Track.</p>
        </header>

        <main class="main">
            <!-- Shorten URL Form -->
            <div class="card shorten-card">
                <h2>Shorten a URL</h2>
                <form id="shorten-form">
                    <div class="input-group">
                        <input type="url" id="url-input" placeholder="Paste your long URL here..." required>
                        <button type="submit" id="shorten-btn">Shorten</button>
                    </div>
                    <div class="options">
                        <div class="option-group">
                            <label for="custom-code">Custom code (optional)</label>
                            <input type="text" id="custom-code" placeholder="e.g. my-link" pattern="[a-zA-Z0-9-_]+" maxlength="20">
                        </div>
                        <div class="option-group">
                            <label for="expire-days">Expire after (days)</label>
                            <select id="expire-days">
                                <option value="0">Never</option>
                                <option value="1">1 day</option>
                                <option value="7">7 days</option>
                                <option value="30" selected>30 days</option>
                                <option value="90">90 days</option>
                            </select>
                        </div>
                    </div>
                </form>

                <!-- Result -->
                <div id="result" class="result hidden">
                    <div class="result-header">
                        <span class="result-label">Your short URL</span>
                        <span id="result-status" class="status-badge">Created!</span>
                    </div>
                    <div class="result-url-group">
                        <input type="text" id="result-url" readonly>
                        <button id="copy-btn" onclick="copyUrl()">Copy</button>
                    </div>
                    <p class="result-original">Original: <a id="result-original-url" href="#" target="_blank"></a></p>
                </div>

                <!-- Error -->
                <div id="error" class="error hidden"></div>
            </div>

            <!-- Stats Lookup -->
            <div class="card stats-card">
                <h2>Check Link Stats</h2>
                <form id="stats-form">
                    <div class="input-group">
                        <input type="text" id="stats-code" placeholder="Enter short code (e.g. abc123)" required>
                        <button type="submit">Look Up</button>
                    </div>
                </form>
                <div id="stats-result" class="stats-result hidden">
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-value" id="stat-clicks">0</span>
                            <span class="stat-label">Total Clicks</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="stat-created">—</span>
                            <span class="stat-label">Created</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="stat-last-click">—</span>
                            <span class="stat-label">Last Clicked</span>
                        </div>
                    </div>
                    <p class="stats-url">Original URL: <a id="stat-original-url" href="#" target="_blank"></a></p>
                </div>
                <div id="stats-error" class="error hidden"></div>
            </div>
        </main>

        <footer class="footer">
            <p>Built with AWS Lambda + API Gateway + DynamoDB</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
